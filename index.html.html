<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEON CHROME — Pinball</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at top, #263044, #080b12 65%);
    color: #cbd5e1;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  .machine { width: min(94vw, 560px); text-align: center; }
  .cabinet {
    padding: 12px;
    border-radius: 24px;
    background: linear-gradient(110deg,#697180,#171d29 8%,#343d4d 50%,#111722 94%,#758091);
    box-shadow: 0 30px 80px #000c, inset 0 1px 2px #fff8;
  }
  .display {
    display: flex;
    justify-content: space-between;
    padding: 12px 18px;
    margin-bottom: 10px;
    border: 2px solid #080c12;
    border-radius: 12px;
    background: repeating-linear-gradient(0deg,#091014 0 2px,#0b191c 2px 4px);
    box-shadow: inset 0 0 16px #000;
    font: bold 22px monospace;
    color: #70fff0;
    text-shadow: 0 0 10px #00eac8;
  }
  .label { font: 9px system-ui; letter-spacing: 3px; color: #809f9c; }
  canvas {
    display: block;
    width: 100%;
    max-height: 72vh;
    aspect-ratio: 760/1080;
    border-radius: 13px;
    background: #081621;
    box-shadow: 0 0 0 2px #03070d;
    touch-action: none;
  }
  .controls { display: flex; gap: 10px; margin-top: 13px; }
  button {
    flex: 1;
    padding: 13px 5px;
    border: 1px solid #536277;
    border-radius: 10px;
    background: linear-gradient(#344458,#162131);
    color: #dceeff;
    font-weight: 800;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    box-shadow: 0 4px 0 #080d16;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #080d16; }
  #launch { color: #ffd37b; }
  .help { font-size: 11px; color: #8092aa; margin: 12px 0 0; }
</style>
</head>
<body>
<div class="machine">
  <div class="cabinet">
    <div class="display">
      <div><div class="label">SCORE</div><span id="score">000000</span></div>
      <div><div class="label">NEON CHROME</div><span id="status">READY</span></div>
      <div><div class="label">BALLS</div><span id="lives">3</span></div>
    </div>
    <canvas id="game" width="760" height="1080"></canvas>
  </div>
  <div class="controls">
    <button id="left">◀ LEFT</button>
    <button id="launch">HOLD TO LAUNCH</button>
    <button id="right">RIGHT ▶</button>
  </div>
  <p class="help">← → / A D: flippers &nbsp; · &nbsp; Space: launch &nbsp; · &nbsp; R: restart</p>
</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 760, H = 1080, R = 13;
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const statusEl = document.getElementById('status');
  const input = { left: false, right: false, launch: false };
  let score = 0, lives = 3, charge = 0, ball, gameOver = false;
  let particles = [], shake = 0, audio, time = 0;

  const bumpers = [
    {x: 285, y: 295, r: 43, flash: 0},
    {x: 475, y: 295, r: 43, flash: 0},
    {x: 380, y: 450, r: 47, flash: 0}
  ];
  const targets = [
    {x: 185,y: 495,lit:false, cooldown:0},
    {x: 575,y: 495,lit:false, cooldown:0},
    {x: 210,y: 620,lit:false, cooldown:0},
    {x: 550,y: 620,lit:false, cooldown:0}
  ];
  const rails = [];
  function rail(ax,ay,bx,by,kind='wall') {
    rails.push({ax,ay,bx,by,kind});
  }
  // Rounded perimeter and dedicated right-hand shooter lane.
  rail(52,835,52,180);
  for (let i=0;i<22;i++) {
    const a=Math.PI+i*Math.PI/22, b=Math.PI+(i+1)*Math.PI/22;
    rail(380+328*Math.cos(a),180+135*Math.sin(a),
         380+328*Math.cos(b),180+135*Math.sin(b));
  }
  rail(708,180,708,1038);
  rail(665,265,665,1038);
  rail(52,835,135,953);
  rail(135,953,242,989);
  rail(665,835,610,953);
  rail(610,953,518,989);
  rail(52,1038,215,1100);
  rail(665,1038,545,1100);
  // Upper guide rails.
  rail(116,250,116,355);
  rail(116,355,160,401);
  rail(623,250,623,355);
  rail(623,355,590,401);
  // Triangular slingshot assemblies.
  const slings = [
    [[155,740],[250,855],[170,870]],
    [[600,740],[505,855],[585,870]]
  ];
  slings.forEach(s => {
    for(let i=0;i<3;i++) rail(...s[i],...s[(i+1)%3],i===0?'sling':'wall');
  });
  const flippers = [
    {x:244,y:941,len:119,angle:.36,rest:.36,up:-.49,side:'left',omega:0},
    {x:516,y:941,len:119,angle:Math.PI-.36,rest:Math.PI-.36,
     up:Math.PI+.49,side:'right',omega:0}
  ];

  function sound(freq=400,duration=.08,type='sine',volume=.05) {
    if (!audio) return;
    const o=audio.createOscillator(), g=audio.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,audio.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*.45),audio.currentTime+duration);
    g.gain.setValueAtTime(volume,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
    o.connect(g);g.connect(audio.destination);
    o.start();o.stop(audio.currentTime+duration);
  }
  function unlock() {
    if(!audio) {
      const Audio = window.AudioContext || window.webkitAudioContext;
      if(Audio) audio = new Audio();
    }
    if(audio?.state==='suspended') audio.resume();
  }
  function spawn() {
    ball={x:687,y:991,vx:0,vy:0,waiting:true,trail:[]};
    charge=0;
    statusEl.textContent='READY';
  }
  function restart() {
    score=0;lives=3;gameOver=false;particles=[];
    targets.forEach(t=>t.lit=false);
    scoreEl.textContent='000000'; livesEl.textContent=lives;
    spawn();
  }
  function points(n) {
    score+=n;scoreEl.textContent=String(score).padStart(6,'0');
  }
  function sparks(x,y,color,count=12) {
    for(let i=0;i<count;i++) {
      const a=Math.random()*Math.PI*2, s=70+Math.random()*220;
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45,color});
    }
  }
  function launch() {
    if(gameOver) { restart(); return; }
    if(!ball.waiting) return;
    ball.waiting=false;
    ball.vy=-(1420+charge*520);
    ball.vx=-12;
    statusEl.textContent='PLAY';
    sound(150,.2,'sawtooth',.035);
    charge=0;
  }
  function setInput(key,value) {
    unlock();
    if(key==='launch' && !value && input.launch) launch();
    if(value && !input[key] && key!=='launch') sound(100,.045,'triangle',.045);
    input[key]=value;
  }
  const keys={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',' ':'launch'};
  window.addEventListener('keydown',e=>{
    if(keys[e.key]) { e.preventDefault();setInput(keys[e.key],true); }
    if(e.key.toLowerCase()==='r') restart();
  });
  window.addEventListener('keyup',e=>{
    if(keys[e.key]) {e.preventDefault();setInput(keys[e.key],false);}
  });
  window.addEventListener('blur',()=>{
    input.left=input.right=input.launch=false;charge=0;
  });
  ['left','right','launch'].forEach(key=>{
    const el=document.getElementById(key);
    el.addEventListener('pointerdown',e=>{
      e.preventDefault();el.setPointerCapture(e.pointerId);setInput(key,true);
    });
    el.addEventListener('pointerup',()=>setInput(key,false));
    el.addEventListener('pointercancel',()=>{input[key]=false;});
  });

  function segmentCollision(ax,ay,bx,by,radius,restitution,flipper=null,kind='wall') {
    const dx=bx-ax,dy=by-ay;
    const t=Math.max(0,Math.min(1,((ball.x-ax)*dx+(ball.y-ay)*dy)/(dx*dx+dy*dy)));
    const px=ax+t*dx,py=ay+t*dy;
    let nx=ball.x-px,ny=ball.y-py;
    const dist=Math.hypot(nx,ny), min=R+radius;
    if(dist>=min) return;
    if(dist<.001) {nx=0;ny=-1;} else {nx/=dist;ny/=dist;}
    ball.x=px+nx*(min+.15);ball.y=py+ny*(min+.15);
    const svx=flipper?-flipper.omega*(py-flipper.y):0;
    const svy=flipper?flipper.omega*(px-flipper.x):0;
    const vn=(ball.vx-svx)*nx+(ball.vy-svy)*ny;
    if(vn<0) {
      ball.vx-=(1+restitution)*vn*nx;
      ball.vy-=(1+restitution)*vn*ny;
      if(kind==='sling') {
        ball.vx+=nx*310;ball.vy+=ny*310;
        points(50);sparks(px,py,'#ffb34a');sound(180,.1,'square',.025);shake=3;
      } else if(Math.abs(vn)>160) sound(110+Math.abs(vn)*.15,.035,'triangle',.025);
    }
  }

  function update(dt) {
    time+=dt;
    bumpers.forEach(b=>b.flash=Math.max(0,b.flash-dt*3));
    targets.forEach(t=>t.cooldown=Math.max(0,t.cooldown-dt));
    for(const f of flippers) {
      const old=f.angle,goal=input[f.side]?f.up:f.rest;
      f.angle+=Math.max(-dt*17,Math.min(dt*17,goal-f.angle));
      f.omega=(f.angle-old)/dt;
    }
    particles=particles.filter(p=>p.life>0);
    particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt;});
    shake=Math.max(0,shake-dt*20);
    if(gameOver) return;
    if(ball.waiting) {
      if(input.launch) charge=Math.min(1,charge+dt*.8);
      ball.y=991+charge*20;
      return;
    }
    ball.vy+=870*dt;
    ball.vx*=Math.exp(-.055*dt);
    ball.vy*=Math.exp(-.055*dt);
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    // Curve the launched ball into the main playfield.
    if(ball.x>652 && ball.y<265 && ball.vy<0) ball.vx-=1900*dt;
    rails.forEach(s=>segmentCollision(s.ax,s.ay,s.bx,s.by,5,.78,null,s.kind));
    flippers.forEach(f=>segmentCollision(f.x,f.y,
      f.x+Math.cos(f.angle)*f.len,f.y+Math.sin(f.angle)*f.len,15,.83,f));
    for(const b of bumpers) {
      let dx=ball.x-b.x,dy=ball.y-b.y,d=Math.hypot(dx,dy);
      if(d<b.r+R) {
        dx/=d||1;dy/=d||1;
        ball.x=b.x+dx*(b.r+R+1);ball.y=b.y+dy*(b.r+R+1);
        const vn=ball.vx*dx+ball.vy*dy;
        if(vn<0) {
          ball.vx-=2*vn*dx;ball.vy-=2*vn*dy;
          ball.vx+=dx*260;ball.vy+=dy*260;
          b.flash=1;points(100);sparks(ball.x,ball.y,'#68fff1');
          sound(620,.12,'sine',.09);shake=4;
        }
      }
    }
    targets.forEach(t=>{
      segmentCollision(t.x-19,t.y,t.x+19,t.y,7,.95);
      if(Math.hypot(ball.x-t.x,ball.y-t.y)<43 && !t.cooldown) {
        t.cooldown=.3;t.lit=true;points(150);
        sparks(t.x,t.y,'#ff71cf');sound(900,.09,'triangle',.06);
        if(targets.every(v=>v.lit)) {
          points(1000);targets.forEach(v=>v.lit=false);
          statusEl.textContent='BONUS!';sound(1400,.35,'sine',.07);
        }
      }
    });
    const speed=Math.hypot(ball.vx,ball.vy);
    if(speed>2200) {ball.vx*=2200/speed;ball.vy*=2200/speed;}
    if(ball.y>1120) {
      lives--;livesEl.textContent=lives;sound(160,.5,'sawtooth',.04);
      if(lives<=0) {gameOver=true;statusEl.textContent='GAME OVER';}
      else spawn();
    }
  }

  function line(ax,ay,bx,by,color,width) {
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);
    ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke();
  }
  function circle(x,y,r,fill,stroke=null,width=1) {
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=fill;ctx.fill();
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}
  }
  function text(str,x,y,size,color,spacing=0) {
    ctx.fillStyle=color;ctx.font=`900 ${size}px system-ui`;
    ctx.textAlign='center';ctx.fillText(str,x,y);
  }
  function draw() {
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(shake) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    const bg=ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,'#132f40');bg.addColorStop(.45,'#0b182d');bg.addColorStop(1,'#25152a');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

    // Printed playfield: fine geometric pattern and illuminated circuits.
    ctx.save();ctx.globalAlpha=.13;
    for(let y=0;y<H;y+=44) for(let x=0;x<W;x+=44) {
      line(x,y,x+22,y+22,'#72adbd',1);
      line(x+22,y+22,x,y+44,'#72adbd',1);
    }
    ctx.restore();
    [160,220,540,600].forEach((x,i)=>{
      ctx.strokeStyle=i%2?'#ff55bc30':'#23efd830';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x,700);ctx.lineTo(x,550);
      ctx.lineTo(x+(x<380?65:-65),480);ctx.lineTo(x+(x<380?65:-65),190);ctx.stroke();
    });
    ctx.save();ctx.translate(380,660);ctx.rotate(-.08);
    text('NEON',0,0,69,'#3fe5da');
    text('C H R O M E',0,44,30,'#edc6eb');
    text('★  AFTER HOURS ARCADE  ★',0,72,11,'#7597ae');
    ctx.restore();
    text('100',285,221,14,'#8badbb');text('100',475,221,14,'#8badbb');
    text('LIGHT ALL TARGETS • 1000',380,551,13,'#bb91b7');

    // Shooter trough.
    ctx.fillStyle='#030911';ctx.fillRect(672,278,28,765);
    line(686,285,686,1027,'#142b3d',3);
    for(let y=1030;y<1070;y+=6) line(677,y,697,y+3,'#9299a4',3);
    const py=1031+charge*20;
    line(675,py,699,py,'#e8bb69',9);
    if(ball.waiting) {
      ctx.fillStyle='#ffc66b';ctx.fillRect(680,960-charge*165,12,charge*165);
      text('↑',686,913,26,'#d8a860');
    }

    slings.forEach(s=>{
      ctx.beginPath();ctx.moveTo(...s[0]);ctx.lineTo(...s[1]);ctx.lineTo(...s[2]);ctx.closePath();
      const g=ctx.createLinearGradient(0,740,0,870);
      g.addColorStop(0,'#843d5b');g.addColorStop(1,'#231c3b');
      ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle='#ffa659';ctx.lineWidth=4;ctx.stroke();
      circle(s[2][0],s[2][1]-12,5,'#c1c7d0');
    });
    // Layered rail strokes create a polished steel cross-section.
    rails.forEach(s=>{
      line(s.ax+3,s.ay+7,s.bx+3,s.by+7,'#0009',14);
      line(s.ax,s.ay,s.bx,s.by,'#050b13',13);
      line(s.ax,s.ay,s.bx,s.by,s.kind==='sling'?'#faaf62':'#798797',8);
      line(s.ax-1,s.ay-2,s.bx-1,s.by-2,s.kind==='sling'?'#fff0b3':'#d3e5eb',2);
    });

    // Rollover lights.
    [245,380,515].forEach((x,i)=>{
      const on=Math.sin(time*2+i*2)>.1;
      ctx.shadowColor='#ffc45c';ctx.shadowBlur=on?18:0;
      circle(x,151,13,on?'#ffd270':'#594326','#10131c',4);
      ctx.shadowBlur=0;text(['N','C','★'][i],x,156,12,'#493520');
    });

    targets.forEach(t=>{
      ctx.shadowColor='#ff58bb';ctx.shadowBlur=t.lit?22:0;
      line(t.x-19,t.y,t.x+19,t.y,'#1c101d',19);
      line(t.x-17,t.y-2,t.x+17,t.y-2,t.lit?'#ffc9ed':'#b84889',11);
      line(t.x-15,t.y-5,t.x+15,t.y-5,'#ffd8f0',2);
      ctx.shadowBlur=0;
    });

    bumpers.forEach(b=>{
      circle(b.x+5,b.y+10,b.r+10,'#0008');
      ctx.shadowColor='#32ffe2';ctx.shadowBlur=b.flash?38:14;
      circle(b.x,b.y,b.r+7,b.flash?'#bafff0':'#179b94');
      ctx.shadowBlur=0;
      circle(b.x,b.y,b.r+1,'#111d2b','#b3d7dc',3);
      const metal=ctx.createRadialGradient(b.x-15,b.y-18,2,b.x,b.y,b.r);
      metal.addColorStop(0,'#e2f5fa');metal.addColorStop(.35,'#6a93a6');
      metal.addColorStop(.7,'#2b485e');metal.addColorStop(1,'#a9c9d3');
      circle(b.x,b.y,b.r-5,metal);
      circle(b.x,b.y,b.r-15,b.flash?'#ecfffa':'#0d424e','#68e8de',2);
      text('✦',b.x,b.y+12,35,b.flash?'#25b7a6':'#8affeb');
      ctx.beginPath();ctx.arc(b.x,b.y,b.r-9,3.6,5.5);
      ctx.strokeStyle='#fff9';ctx.lineWidth=3;ctx.stroke();
    });

    flippers.forEach(f=>{
      const ex=f.x+Math.cos(f.angle)*f.len,ey=f.y+Math.sin(f.angle)*f.len;
      line(f.x+3,f.y+9,ex+3,ey+9,'#0009',38);
      line(f.x,f.y,ex,ey,'#090f1c',36);
      line(f.x,f.y,ex,ey,'#d85a79',30);
      line(f.x,f.y-3,ex,ey-3,'#ffe5dd',21);
      line(f.x+3,f.y-6,ex-3,ey-6,'#fff',4);
      circle(f.x,f.y,10,'#8797a8','#e4ebf2',2);
      circle(f.x,f.y,4,'#334052');
    });
    // Cabinet fasteners.
    [[30,40],[730,40],[30,1018],[731,1018]].forEach(([x,y])=>{
      circle(x+1,y+2,8,'#000');circle(x,y,7,'#8b99a8');
      line(x-3,y+2,x+3,y-2,'#263240',2);
    });

    if(!gameOver) {
      ball.trail.push({x:ball.x,y:ball.y});
      if(ball.trail.length>8) ball.trail.shift();
      if(!ball.waiting) ball.trail.forEach((p,i)=>{
        circle(p.x,p.y,R*i/10,`rgba(150,225,255,${i*.009})`);
      });
      circle(ball.x+6,ball.y+9,R+2,'#0008');
      const steel=ctx.createRadialGradient(ball.x-5,ball.y-6,1,ball.x+2,ball.y+3,R+3);
      steel.addColorStop(0,'#ffffff');steel.addColorStop(.18,'#effaff');
      steel.addColorStop(.38,'#adbfcc');steel.addColorStop(.56,'#394c60');
      steel.addColorStop(.75,'#8eacbc');steel.addColorStop(1,'#152234');
      circle(ball.x,ball.y,R,steel,'#c6e7ef',.7);
      circle(ball.x-4,ball.y-5,3,'#fff');
    }
    particles.forEach(p=>{
      ctx.globalAlpha=Math.max(0,p.life/.45);
      line(p.x,p.y,p.x-p.vx*.022,p.y-p.vy*.022,p.color,2);
    });ctx.globalAlpha=1;

    // Subtle glass reflections over the entire playfield.
    const glass=ctx.createLinearGradient(0,0,W,450);
    glass.addColorStop(0,'#ffffff0b');glass.addColorStop(.45,'#ffffff00');
    glass.addColorStop(.5,'#ffffff04');glass.addColorStop(1,'#ffffff00');
    ctx.fillStyle=glass;ctx.fillRect(0,0,W,H);
    if(gameOver) {
      ctx.fillStyle='#030913ce';ctx.fillRect(80,420,580,220);
      text('GAME OVER',380,493,48,'#ffb8d9');
      text(`FINAL SCORE  ${score.toLocaleString()}`,380,544,23,'#94fff0');
      text('Press R or tap LAUNCH to play again',380,595,18,'#c3cedb');
    } else if(ball.waiting) {
      text('HOLD SPACE / LAUNCH',365,1032,17,'#d2b17d');
    }
    ctx.restore();
  }
  // Fixed 240 Hz physics prevents the fast-moving ball from tunneling.
  let last=performance.now(),accumulator=0;
  function frame(now) {
    accumulator+=Math.min((now-last)/1000,.05);last=now;
    while(accumulator>=1/240) {update(1/240);accumulator-=1/240;}
    draw();requestAnimationFrame(frame);
  }
  restart();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
